<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Poppins:wght@300;400;500;600&family=Noto+Sans+Devanagari&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&family=Chakra+Petch:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-style="doodle">
<button id="styleBtn" class="styleBtn">I don't like this design</button>
<main class="stage">
  <div class="float">
    <div class="spin" id="spin">
      <div class="card" id="card"><!-- card sides are built by script.js --></div>
    </div>
  </div>
  <div class="actions">
    <button id="saveBtn">Save card</button>
    <a id="siteBtn" href="#" target="_blank" rel="noopener">Visit site</a>
  </div>
</main>
<div id="qrTemp" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
